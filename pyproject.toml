[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apiscout"
version = "0.1.0"
description = "An aesthetic, all-in-one API security scanner CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21.0",
    "anyio>=4.3.0",
]

[project.scripts]
apiscout = "apiscout.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]
